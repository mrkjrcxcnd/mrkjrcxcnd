name: Update profile artwork

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile/config.json'
      - 'scripts/generate_profile.py'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Fetch GitHub data and render SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_profile.py --refresh
      - name: Commit changed artwork as the Actions bot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile.svg assets/profile-mobile.svg profile/github-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update profile stats'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
